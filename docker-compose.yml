version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amazing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-amazing_db}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amazing} -d amazing_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-amazing}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-amazing_db}
      PORT: ${SERVER_PORT:-3001}
    ports:
      - "${SERVER_PORT:-3001}:${SERVER_PORT:-3001}"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    restart: unless-stopped
    environment:
      CLIENT_PORT: ${CLIENT_PORT:-3000}
      VITE_API_URL: http://localhost:${SERVER_PORT:-3001}
    ports:
      - "${CLIENT_PORT:-3000}:${CLIENT_PORT:-3000}"
    depends_on:
      - server
    volumes:
      - ./packages/client/src:/app/packages/client/src

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
